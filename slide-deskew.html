<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>投影片自動拉正</title>
<style>
  :root{ --bg:#101418; --card:#1b2128; --fg:#e8edf2; --sub:#9aa7b4; --accent:#4c9be8; --accent2:#3ad29f; --line:#2b333c; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"PingFang TC","Helvetica Neue",Arial,sans-serif; overscroll-behavior:none; }
  .wrap{ max-width:760px; margin:0 auto; padding:16px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  h1{ font-size:19px; margin:6px 0 2px; }
  .tip{ color:var(--sub); font-size:13px; line-height:1.6; margin:0 0 14px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:16px; border:none; border-radius:14px; font-size:17px; font-weight:600;
    background:var(--accent); color:#fff; cursor:pointer; margin:8px 0; }
  .btn.sec{ background:var(--card); color:var(--fg); border:1px solid var(--line); }
  .btn.go{ background:var(--accent2); color:#08251b; }
  .btn:active{ filter:brightness(.9); }
  .btn:disabled{ opacity:.5; }
  .row{ display:flex; gap:10px; }
  .row .btn{ margin:8px 0; }
  .hidden{ display:none !important; }
  #loading{ position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:50; }
  .spin{ width:38px; height:38px; border:4px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .stage{ position:relative; width:100%; background:#000; border-radius:14px; overflow:hidden; }
  video, .stage canvas, .stage img{ display:block; width:100%; height:auto; }
  /* 相機改為全螢幕覆蓋，控制列永遠可見 */
  #camera{ position:fixed; inset:0; z-index:40; background:#000; display:flex; flex-direction:column; }
  #camStage{ position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #video{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); max-width:100%; max-height:100%; z-index:0; }
  #camCanvas{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1; }
  #liveOverlay{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2; pointer-events:none; }
  .lockpill{ position:absolute; top:calc(10px + env(safe-area-inset-top)); left:calc(10px + env(safe-area-inset-left)); z-index:3;
    background:rgba(0,0,0,.55); color:#fff; border-radius:20px; padding:7px 12px; font-size:13px; }
  .lockpill.on{ background:rgba(58,210,159,.92); color:#08251b; font-weight:700; }
  .cambottom{ position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); }
  .zoombar{ display:flex; align-items:center; gap:8px; width:100%; max-width:520px; }
  .zoombar input[type=range]{ flex:1; height:26px; accent-color:#fff; }
  .zbtn{ background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:16px; padding:6px 9px; font-size:13px; cursor:pointer; }
  .zbtn.on{ background:#fff; color:#000; font-weight:700; }
  #zoomval{ background:rgba(0,0,0,.55); color:#fff; border-radius:12px; padding:5px 7px; font-size:12px; min-width:42px; text-align:center; }
  .camhint{ color:#fff; font-size:13px; text-align:center; opacity:.9; margin:0; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  #shutter{ width:72px; height:72px; border-radius:50%; background:#fff; border:5px solid rgba(255,255,255,.4); cursor:pointer; }
  #shutter:active{ transform:scale(.92); }
  .camtop{ position:absolute; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); z-index:2; display:flex; gap:8px; }
  .chip{ background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:20px; padding:8px 12px;
    font-size:14px; cursor:pointer; }
  /* 編輯器（拖四角）版面 */
  #editStage{ display:flex; align-items:center; justify-content:center; background:#000; padding:0; }
  #editCanvas{ display:block; width:auto !important; height:auto !important; }
  #overlay{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:auto !important; height:auto !important; touch-action:none; }
  #loupe{ position:absolute; top:8px; right:8px; width:130px !important; height:130px !important; border-radius:50%; border:2px solid #3ad29f; display:none; z-index:5; background:#000; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  .seg{ display:flex; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:12px 0; }
  .seg button{ flex:1; padding:11px 6px; background:none; border:none; color:var(--sub); font-size:14px; cursor:pointer; }
  .seg button.on{ background:var(--accent); color:#fff; font-weight:600; }
  .label{ font-size:13px; color:var(--sub); margin:14px 0 2px; }
  .status{ font-size:13px; padding:9px 12px; border-radius:10px; margin:10px 0; }
  .status.ok{ background:rgba(58,210,159,.12); color:var(--accent2); }
  .status.warn{ background:rgba(232,180,76,.14); color:#e8b44c; }
  .center{ text-align:center; }
  .foot{ color:var(--sub); font-size:12px; margin-top:18px; line-height:1.7; }
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><div id="loadtxt">正在載入影像引擎…</div></div>

<div class="wrap">
  <h1>📐 投影片自動拉正</h1>
  <p class="tip">拍下講者投影的簡報，會自動找出畫面四個角並拉正成方正的圖，再一鍵送進備忘錄或存到照片。</p>

  <!-- 首頁 -->
  <div id="home">
    <button class="btn" id="btnCam">📷 開啟相機拍照</button>
    <button class="btn sec" id="btnFile">🖼️ 從照片選一張</button>
    <input id="fileInput" type="file" accept="image/*" class="hidden">
    <input id="capInput" type="file" accept="image/*" capture="environment" class="hidden">
    <p class="foot">全程在你的裝置本機處理，照片不會上傳。<br>提示：iPhone 相機格式建議設為「最相容(JPEG)」。</p>
  </div>

  <!-- 相機 -->
  <div id="camera" class="hidden">
    <div id="camStage">
      <video id="video" playsinline muted></video>
      <canvas id="camCanvas"></canvas>
      <canvas id="liveOverlay"></canvas>
      <div class="lockpill" id="lockpill">尋找投影片中…</div>
    </div>
    <div class="camtop">
      <button class="chip" id="btnSwitch">切換鏡頭</button>
      <button class="chip" id="btnCamClose">取消</button>
    </div>
    <div class="cambottom">
      <p class="camhint">拉近讓螢幕填滿大半畫面、四角都入鏡 · 沒綠框也能拍，拍完可手動微調</p>
      <div class="zoombar">
        <button class="zbtn" data-z="1">1×</button>
        <button class="zbtn" data-z="2">2×</button>
        <button class="zbtn" data-z="3">3×</button>
        <input id="zoom" type="range" min="1" max="6" step="0.1" value="1">
        <span id="zoomval">1.0×</span>
      </div>
      <div id="shutter"></div>
    </div>
  </div>

  <!-- 結果 -->
  <div id="result" class="hidden">
    <div id="statusBox" class="status ok">已自動偵測並拉正 ✓</div>
    <div class="stage"><canvas id="outCanvas"></canvas></div>

    <div class="label">長寬比</div>
    <div class="seg" id="aspectSeg">
      <button data-a="auto" class="on">自動</button>
      <button data-a="1.3333">4:3</button>
      <button data-a="1.7778">16:9</button>
      <button data-a="1.4142">A4</button>
    </div>

    <button class="btn go" id="btnCopy">📋 複製圖片（直接貼到筆記）</button>
    <div class="row">
      <button class="btn sec" id="btnShare">📤 分享</button>
      <button class="btn" id="btnNext">📷 拍下一張</button>
    </div>
    <div class="row">
      <button class="btn sec" id="btnDownload">⬇︎ 下載 PNG</button>
      <button class="btn sec" id="btnRetake">↻ 重新選擇</button>
    </div>
    <button class="btn sec" id="btnManual">偵測不準？手動微調四角</button>
    <p class="foot">按「複製圖片」後，切到備忘錄長按 →「貼上」即可。若無法複製，改用「分享」或長按上方圖片。</p>
  </div>

  <!-- 手動微調（像備忘錄掃描：拖四個角） -->
  <div id="editor" class="hidden">
    <div class="tip" id="editTip">拖動四個圓點對準投影片的四個角，完成後按「拉正」。</div>
    <div class="stage" id="editStage">
      <canvas id="editCanvas"></canvas>
      <canvas id="overlay"></canvas>
      <canvas id="loupe" width="130" height="130"></canvas>
    </div>
    <div class="row">
      <button class="btn go" id="btnApply">✓ 拉正</button>
      <button class="btn sec" id="btnEditCancel">取消</button>
    </div>
  </div>
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js" onload="onCvReady()" onerror="onCvError()"></script>
<script>
let cvReady=false, stream=null, facing='environment';
let vTrack=null, nativeZoom=false, digitalZoom=1;   // 變焦狀態
let srcImg=new Image();               // 目前載入的原圖
let detectedQuad=null;                 // 偵測到的四角（原圖座標）TL,TR,BR,BL
let handles=null, dragIdx=-1, editorReturn='home';   // 手動微調用
const $=id=>document.getElementById(id);
const show=id=>['home','camera','result','editor'].forEach(s=>$(s).classList.toggle('hidden', s!==id));

function onCvReady(){
  if(window.cv && cv.getBuildInformation){ ready(); }
  else { cv['onRuntimeInitialized']=ready; }
}
function ready(){ cvReady=true; $('loading').classList.add('hidden'); }
function onCvError(){ $('loadtxt').textContent='影像引擎載入失敗，請確認網路後重新整理。'; }

/* ---------- 載入來源 ---------- */
$('btnCam').onclick=startCamera;
$('btnFile').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>loadFromFile(e.target.files[0]);
$('capInput').onchange=e=>loadFromFile(e.target.files[0]);

function loadFromFile(file){
  if(!file) return;
  const url=URL.createObjectURL(file);
  srcImg=new Image();
  srcImg.onload=()=>{ URL.revokeObjectURL(url); autoProcess(); };
  srcImg.onerror=()=>{ URL.revokeObjectURL(url); alert('無法讀取這張圖，若是 HEIC 請改用 JPEG。'); };
  srcImg.src=url;
}

/* ---------- 相機 ---------- */
async function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext){
    $('capInput').click();  // 無法即時相機時，改用系統相機
    return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:facing}, width:{ideal:3840}, height:{ideal:2160} }, audio:false });
    $('video').srcObject=stream; await $('video').play();
    vTrack=stream.getVideoTracks()[0];
    setupZoom();
    show('camera');
    startLive();
  }catch(e){ $('capInput').click(); }
}
function stopCamera(){ stopLive(); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

/* 即時預覽：把相機畫面畫到 canvas，並即時偵測、疊出綠色四角框 */
let liveRAF=null, lastDetect=0, liveQuad=null;
function startLive(){
  const v=$('video'), cc=$('camCanvas'), ov=$('liveOverlay'), stage=$('camStage');
  liveQuad=null;
  function loop(){
    liveRAF=requestAnimationFrame(loop);
    if(!stream || !v.videoWidth) return;
    const sw=stage.clientWidth, sh=stage.clientHeight, va=v.videoWidth/v.videoHeight;
    let dW=sw, dH=sw/va; if(dH>sh){ dH=sh; dW=sh*va; }
    dW=Math.round(dW); dH=Math.round(dH);
    if(cc.width!==dW||cc.height!==dH){ [cc,ov].forEach(c=>{c.width=dW;c.height=dH;c.style.width=dW+'px';c.style.height=dH+'px';}); }
    // 依數位變焦擷取中央區域
    let sx=0,sy=0,cw=v.videoWidth,ch=v.videoHeight;
    if(!nativeZoom && digitalZoom>1){ cw=v.videoWidth/digitalZoom; ch=v.videoHeight/digitalZoom; sx=(v.videoWidth-cw)/2; sy=(v.videoHeight-ch)/2; }
    cc.getContext('2d').drawImage(v, sx,sy,cw,ch, 0,0, dW,dH);
    const now=performance.now();
    if(cvReady && now-lastDetect>250){ lastDetect=now; liveQuad=fastDetect(cc); updateLock(liveQuad); }
    drawLive(ov, liveQuad);
  }
  liveRAF=requestAnimationFrame(loop);
}
function stopLive(){ if(liveRAF) cancelAnimationFrame(liveRAF); liveRAF=null; liveQuad=null; const ov=$('liveOverlay'); if(ov) ov.getContext('2d').clearRect(0,0,ov.width,ov.height); }
function updateLock(q){ const p=$('lockpill'); if(q){ p.className='lockpill on'; p.textContent='✓ 已框到投影片，可以拍'; } else { p.className='lockpill'; p.textContent='沒框到也可以拍，拍完再手動微調'; } }
function drawLive(ov,q){
  const c=ov.getContext('2d'); c.clearRect(0,0,ov.width,ov.height); if(!q) return;
  c.lineWidth=3; c.strokeStyle='#3ad29f'; c.fillStyle='rgba(58,210,159,.14)';
  c.beginPath(); q.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); c.closePath(); c.fill(); c.stroke();
  q.forEach(p=>{ c.beginPath(); c.arc(p.x,p.y,7,0,7); c.fillStyle='#3ad29f'; c.fill(); });
}
// 即時用的輕量偵測（Canny+自適應，評分挑投影片）；回傳 canvas 座標的 TL,TR,BR,BL
function fastDetect(canvas){
  const W=canvas.width,H=canvas.height, scale=Math.min(1,480/Math.max(W,H));
  const sw=Math.round(W*scale), sh=Math.round(H*scale);
  const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh;
  tmp.getContext('2d').drawImage(canvas,0,0,sw,sh);
  const cdata=colorStats(tmp);
  let src=cv.imread(tmp), gray=new cv.Mat(), m=new cv.Mat(), k=cv.Mat.ones(5,5,cv.CV_8U);
  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY); cv.GaussianBlur(gray,gray,new cv.Size(5,5),0);
  const area0=sw*sh, tol=0.02*Math.max(sw,sh), corners=[{x:0,y:0},{x:sw,y:0},{x:sw,y:sh},{x:0,y:sh}];
  const nearFull=pts=>corners.every(c=>pts.some(p=>Math.hypot(p.x-c.x,p.y-c.y)<tol));
  const cands=[];
  function harvest(){ let e=new cv.Mat(); cv.dilate(m,e,k);
    let cs=new cv.MatVector(), hi=new cv.Mat(); cv.findContours(e,cs,hi,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
    for(let i=0;i<cs.size();i++){ const c=cs.get(i); const peri=cv.arcLength(c,true);
      const ap=new cv.Mat(); cv.approxPolyDP(c,ap,0.02*peri,true);
      if(ap.rows===4&&cv.isContourConvex(ap)){ const frac=Math.abs(cv.contourArea(ap))/area0;
        const pts=[]; for(let j=0;j<4;j++) pts.push({x:ap.data32S[j*2],y:ap.data32S[j*2+1]});
        if(frac>0.10&&frac<0.97&&!nearFull(pts)) cands.push({frac,pts}); }
      ap.delete(); c.delete(); }
    cs.delete(); hi.delete(); e.delete();
  }
  cv.Canny(gray,m,50,150); harvest();
  let ad=new cv.Mat(); cv.adaptiveThreshold(gray,ad,255,cv.ADAPTIVE_THRESH_MEAN_C,cv.THRESH_BINARY,31,10);
  cv.Canny(ad,m,50,150); harvest(); ad.delete();
  let ot=new cv.Mat(); cv.threshold(gray,ot,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);
  cv.Canny(ot,m,50,150); harvest(); ot.delete();
  src.delete();gray.delete();m.delete();k.delete();
  let best=null,bestScore=0;
  for(const c of cands){ const sc=scoreQuad(c.frac,c.pts,cdata.g,cdata.s,sw,sh); if(sc>bestScore){bestScore=sc;best=c.pts;} }
  return best?orderCorners(best.map(p=>({x:p.x/scale,y:p.y/scale}))):null;
}

/* 變焦：優先用硬體變焦(畫質好)，不支援則用數位變焦(裁切放大) */
function setupZoom(){
  const zi=$('zoom'); digitalZoom=1; nativeZoom=false;
  let caps={}; try{ caps=vTrack.getCapabilities?vTrack.getCapabilities():{}; }catch(e){}
  if(caps && caps.zoom){
    nativeZoom=true;
    zi.min=caps.zoom.min||1; zi.max=caps.zoom.max||6; zi.step=caps.zoom.step||0.1; zi.value=caps.zoom.min||1;
  }else{
    zi.min=1; zi.max=6; zi.step=0.1; zi.value=1;
  }
  $('zoomval').textContent=parseFloat(zi.value).toFixed(1)+'×';
  setZoomActiveBtn(parseFloat(zi.value));
}
function applyZoom(z){
  z=Math.max(parseFloat($('zoom').min), Math.min(parseFloat($('zoom').max), z));
  $('zoom').value=z; $('zoomval').textContent=z.toFixed(1)+'×'; setZoomActiveBtn(z);
  if(nativeZoom){ try{ vTrack.applyConstraints({advanced:[{zoom:z}]}); }catch(e){} }
  else{ digitalZoom=z; }   // 數位變焦由即時預覽的 canvas 擷取處理
}
function setZoomActiveBtn(z){ document.querySelectorAll('.zbtn').forEach(b=>b.classList.toggle('on', Math.abs(parseFloat(b.dataset.z)-z)<0.05)); }
$('zoom').oninput=e=>applyZoom(parseFloat(e.target.value));
document.querySelectorAll('.zbtn').forEach(b=>b.onclick=()=>applyZoom(parseFloat(b.dataset.z)));
// 雙指縮放
let pinch=null; const tdist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
const camStage=$('camStage');
camStage.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch={d:tdist(e), z:parseFloat($('zoom').value)}; } },{passive:false});
camStage.addEventListener('touchmove',e=>{ if(e.touches.length===2 && pinch){ e.preventDefault(); applyZoom(pinch.z*(tdist(e)/pinch.d)); } },{passive:false});
camStage.addEventListener('touchend',e=>{ if(e.touches.length<2) pinch=null; });
$('btnCamClose').onclick=()=>{ stopCamera(); show('home'); };
$('btnSwitch').onclick=async()=>{ facing = facing==='environment'?'user':'environment'; stopCamera(); await startCamera(); };
$('shutter').onclick=()=>{
  const v=$('video');
  let sx=0,sy=0,cw=v.videoWidth,ch=v.videoHeight;
  if(!nativeZoom && digitalZoom>1){          // 數位變焦：擷取中央放大區域
    cw=v.videoWidth/digitalZoom; ch=v.videoHeight/digitalZoom;
    sx=(v.videoWidth-cw)/2; sy=(v.videoHeight-ch)/2;
  }
  const c=document.createElement('canvas'); c.width=Math.round(cw); c.height=Math.round(ch);
  c.getContext('2d').drawImage(v, sx,sy,cw,ch, 0,0, c.width,c.height);
  stopCamera();
  srcImg=new Image();
  srcImg.onload=autoProcess;
  srcImg.src=c.toDataURL('image/png');
};

/* ---------- 自動偵測 + 拉正 ---------- */
function autoProcess(){
  // 先自動偵測並直接拉正顯示結果；若沒抓到才進微調
  detectedQuad=detectQuad(srcImg);
  if(!detectedQuad){
    editorReturn='home';
    $('editTip').textContent='沒自動抓到投影片。請拖四個角對準後按「拉正」；或按「取消」重拍、拉近一點。';
    openEditor();
    return;
  }
  const warped=warp(srcImg, detectedQuad, currentAspect());
  drawTo($('outCanvas'), warped); warped.delete();
  $('statusBox').className='status ok'; $('statusBox').textContent='已自動偵測並拉正 ✓　偵測不準可下方微調';
  show('result');
  copyResult().then(copiedOk).catch(()=>{});   // 拍完盡力自動複製
}

function fallbackQuad(img){
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  return [{x:0,y:0},{x:w,y:0},{x:w,y:h},{x:0,y:h}];
}

// 回傳 TL,TR,BR,BL（原圖座標）或 null。多策略偵測：Canny×2 + 自適應 + Otsu + 亮度門檻
function detectQuad(img){
  const W=img.naturalWidth||img.width, H=img.naturalHeight||img.height;
  const scale=Math.min(1, 900/Math.max(W,H));   // 縮小加速
  const sw=Math.round(W*scale), sh=Math.round(H*scale);
  const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh;
  tmp.getContext('2d').drawImage(img,0,0,sw,sh);

  let src=cv.imread(tmp), gray=new cv.Mat(), g=new cv.Mat();
  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray,g,new cv.Size(5,5),0);

  const cdata=colorStats(tmp);
  const area0=sw*sh;
  const imgCorners=[{x:0,y:0},{x:sw,y:0},{x:sw,y:sh},{x:0,y:sh}];
  const tol=0.02*Math.max(sw,sh);
  const nearFull=pts=> imgCorners.every(c=> pts.some(p=>Math.hypot(p.x-c.x,p.y-c.y)<tol));
  const cands=[];                              // 收集所有候選，最後評分

  function harvest(edges){
    let e2=new cv.Mat(), k=cv.Mat.ones(5,5,cv.CV_8U);
    cv.dilate(edges,e2,k);
    let contours=new cv.MatVector(), hi=new cv.Mat();
    cv.findContours(e2,contours,hi,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
    for(let i=0;i<contours.size();i++){
      const c=contours.get(i); const peri=cv.arcLength(c,true);
      for(let e=0;e<2;e++){
        const ap=new cv.Mat(); cv.approxPolyDP(c,ap,(e?0.04:0.02)*peri,true);
        if(ap.rows===4 && cv.isContourConvex(ap)){
          const frac=Math.abs(cv.contourArea(ap))/area0;
          const pts=[]; for(let j=0;j<4;j++) pts.push({x:ap.data32S[j*2], y:ap.data32S[j*2+1]});
          // 排除太小、幾乎整張畫面、以及外框
          if(frac>0.10 && frac<0.97 && !nearFull(pts)) cands.push({frac, pts});
        }
        ap.delete();
      }
      c.delete();
    }
    contours.delete(); hi.delete(); e2.delete(); k.delete();
  }

  let m=new cv.Mat();
  cv.Canny(g,m,50,150); harvest(m);
  cv.Canny(g,m,30,90);  harvest(m);
  let ad=new cv.Mat();
  cv.adaptiveThreshold(g,ad,255,cv.ADAPTIVE_THRESH_MEAN_C,cv.THRESH_BINARY,31,10);
  cv.Canny(ad,m,50,150); harvest(m); ad.delete();
  let ot=new cv.Mat();
  cv.threshold(g,ot,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);
  cv.Canny(ot,m,50,150); harvest(m); ot.delete();
  let bw=new cv.Mat(); const mean=cv.mean(g)[0];
  cv.threshold(g,bw,mean+25,255,cv.THRESH_BINARY);
  let kk=cv.Mat.ones(9,9,cv.CV_8U); cv.morphologyEx(bw,bw,cv.MORPH_CLOSE,kk);
  cv.Canny(bw,m,50,150); harvest(m); bw.delete(); kk.delete();

  src.delete(); gray.delete(); g.delete(); m.delete();

  // 依評分挑最像投影片的候選
  let best=null, bestScore=0;
  for(const c of cands){
    const sc=scoreQuad(c.frac, c.pts, cdata.g, cdata.s, sw, sh);
    if(sc>bestScore){ bestScore=sc; best=c.pts; }
  }
  if(!best) return null;
  return orderCorners(best.map(p=>({x:p.x/scale, y:p.y/scale})));
}

function orderCorners(p){
  const bySum=[...p].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  const byDiff=[...p].sort((a,b)=>(a.y-a.x)-(b.y-b.x));
  return [ bySum[0], byDiff[0], bySum[3], byDiff[3] ]; // TL,TR,BR,BL
}

/* --- 候選四邊形評分：偏好「亮 + 有顏色(避開純白白板) + 比例像投影片 + 大小合理」 --- */
function colorStats(canvas){
  const w=canvas.width,h=canvas.height, d=canvas.getContext('2d').getImageData(0,0,w,h).data;
  const g=new Uint8Array(w*h), s=new Uint8Array(w*h);   // g=亮度, s=彩度(HSV S)
  for(let i=0,j=0;i<d.length;i+=4,j++){
    const r=d[i],gg=d[i+1],b=d[i+2];
    g[j]=(r*0.299+gg*0.587+b*0.114)|0;
    const mx=Math.max(r,gg,b), mn=Math.min(r,gg,b);
    s[j]= mx>0 ? ((mx-mn)*255/mx)|0 : 0;
  }
  return {g,s};
}
function inQuad(px,py,q){
  let s=0;
  for(let i=0;i<4;i++){ const a=q[i],b=q[(i+1)%4];
    const cr=(b.x-a.x)*(py-a.y)-(b.y-a.y)*(px-a.x); const sg=cr>=0?1:-1;
    if(i===0) s=sg; else if(sg!==s) return false; }
  return true;
}
function quadMean(q,arr,w,h){
  const xs=q.map(p=>p.x), ys=q.map(p=>p.y);
  let x0=Math.max(0,Math.floor(Math.min(...xs))), x1=Math.min(w-1,Math.ceil(Math.max(...xs)));
  let y0=Math.max(0,Math.floor(Math.min(...ys))), y1=Math.min(h-1,Math.ceil(Math.max(...ys)));
  const step=Math.max(1,Math.floor(Math.min(x1-x0,y1-y0)/18));
  let sum=0,n=0;
  for(let y=y0;y<=y1;y+=step) for(let x=x0;x<=x1;x+=step){ if(inQuad(x+0.5,y+0.5,q)){ sum+=arr[y*w+x]; n++; } }
  return n? sum/n : 0;
}
function aspectPlaus(q){
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const ar=((d(q[0],q[1])+d(q[3],q[2]))/2)/Math.max(1,(d(q[0],q[3])+d(q[1],q[2]))/2);
  return Math.max(0, 1-Math.min(Math.abs(ar-1.3333)/1.3333, Math.abs(ar-1.5)/1.5, Math.abs(ar-1.7778)/1.7778));
}
function scoreQuad(frac,q,g,s,w,h){
  const b=quadMean(q,g,w,h)/255;         // 亮度
  const sat=quadMean(q,s,w,h)/255;       // 彩度：白板≈0 被降權，有顏色投影片被加分
  return b*b*b*(0.3+aspectPlaus(q))*(0.6+0.4*Math.min(frac,0.5))*(0.3+1.5*sat);
}

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function currentAspect(){ const v=document.querySelector('#aspectSeg .on').dataset.a; return v==='auto'?null:parseFloat(v); }

// 用 OpenCV 透視變換；回傳 cv.Mat（RGBA）
function warp(img, q, aspect){
  const wTop=dist(q[0],q[1]), wBot=dist(q[3],q[2]), hL=dist(q[0],q[3]), hR=dist(q[1],q[2]);
  let outW=Math.round((wTop+wBot)/2), outH=Math.round((hL+hR)/2);
  if(aspect){ outH=Math.round(outW/aspect); }
  const cap=2400, m=Math.max(outW,outH); if(m>cap){ const s=cap/m; outW=Math.round(outW*s); outH=Math.round(outH*s); }
  outW=Math.max(2,outW); outH=Math.max(2,outH);

  const cnv=document.createElement('canvas'); cnv.width=img.naturalWidth||img.width; cnv.height=img.naturalHeight||img.height;
  cnv.getContext('2d').drawImage(img,0,0);
  let src=cv.imread(cnv), dst=new cv.Mat();
  let s=cv.matFromArray(4,1,cv.CV_32FC2,[q[0].x,q[0].y,q[1].x,q[1].y,q[2].x,q[2].y,q[3].x,q[3].y]);
  let d=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,outW,0,outW,outH,0,outH]);
  let M=cv.getPerspectiveTransform(s,d);
  cv.warpPerspective(src,dst,M,new cv.Size(outW,outH),cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(255,255,255,255));
  src.delete(); s.delete(); d.delete(); M.delete();
  return dst;
}
function drawTo(canvas, mat){ cv.imshow(canvas, mat); }

/* ---------- 長寬比切換即時重算 ---------- */
$('aspectSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $('aspectSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const w=warp(srcImg, detectedQuad||fallbackQuad(srcImg), currentAspect());
  drawTo($('outCanvas'), w); w.delete();
});

/* ---------- 輸出 ---------- */
$('btnRetake').onclick=()=>show('home');
$('btnNext').onclick=()=>startCamera();   // 直接回到相機拍下一張
function copyResult(){   // 回傳 Promise；iOS 相容寫法：ClipboardItem 直接吃 Promise<Blob>
  if(!window.ClipboardItem || !navigator.clipboard) return Promise.reject();
  const item=new ClipboardItem({ 'image/png': new Promise(res=>$('outCanvas').toBlob(b=>res(b),'image/png')) });
  return navigator.clipboard.write([item]);
}
function copiedOk(){
  const b=$('btnCopy'); b.textContent='✓ 已複製，去筆記貼上'; setTimeout(()=>b.textContent='📋 複製圖片（直接貼到筆記）',1800);
  $('statusBox').className='status ok'; $('statusBox').textContent='已複製到剪貼簿 ✓　切到備忘錄貼上即可';
}
function copyFail(){ $('statusBox').className='status warn'; $('statusBox').textContent='此裝置無法自動複製，請按「複製圖片」或「分享」，或長按上方圖片 →「拷貝」。'; }
$('btnCopy').onclick=()=>copyResult().then(copiedOk).catch(copyFail);
$('btnDownload').onclick=()=>{ const a=document.createElement('a'); a.download='slide.png'; a.href=$('outCanvas').toDataURL('image/png'); a.click(); };
$('btnShare').onclick=async()=>{
  $('outCanvas').toBlob(async blob=>{
    const file=new File([blob],'slide.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'投影片'}); }catch(e){}
    }else{
      const a=document.createElement('a'); a.download='slide.png'; a.href=URL.createObjectURL(blob); a.click();
    }
  },'image/png');
};

/* ---------- 手動微調（備援） ---------- */
$('btnManual').onclick=()=>{ editorReturn='result'; $('editTip').textContent='拖四個角對準投影片（可把上緣往上拉，避免裁掉深色標題），完成後按「拉正」。'; openEditor(); };
$('btnEditCancel').onclick=()=>show(editorReturn);
function openEditor(){
  const ec=$('editCanvas'), ov=$('overlay');
  const W=srcImg.naturalWidth||srcImg.width, H=srcImg.naturalHeight||srcImg.height;
  const availW=Math.min(760, document.querySelector('.wrap').clientWidth-32);
  const availH=Math.max(240, window.innerHeight-210);      // 預留 tip 與按鈕
  const s=Math.min(availW/W, availH/H, 1);
  const dw=Math.round(W*s), dh=Math.round(H*s);
  ec.width=dw; ec.height=dh; ov.width=dw; ov.height=dh;
  ec.style.width=dw+'px'; ec.style.height=dh+'px'; ov.style.width=dw+'px'; ov.style.height=dh+'px';
  ec.getContext('2d').drawImage(srcImg,0,0,dw,dh);
  ec._s=s;
  const q=detectedQuad||insetQuad(W,H);
  handles=q.map(p=>({x:p.x*s,y:p.y*s}));
  drawOverlay();
  show('editor');
}
function showLoupe(px,py){
  const lp=$('loupe'), ov=$('overlay'), s=$('editCanvas')._s;
  const ix=px/s, iy=py/s, L=lp.width, Z=3, ss=L/Z;
  const c=lp.getContext('2d'); c.clearRect(0,0,L,L);
  c.save(); c.beginPath(); c.arc(L/2,L/2,L/2-1,0,7); c.clip();
  c.drawImage(srcImg, ix-ss/2, iy-ss/2, ss, ss, 0,0, L,L); c.restore();
  c.strokeStyle='#3ad29f'; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(L/2-12,L/2); c.lineTo(L/2+12,L/2); c.moveTo(L/2,L/2-12); c.lineTo(L/2,L/2+12); c.stroke();
  const topRight = px>ov.width*0.6 && py<ov.height*0.35;   // 手指在右上時放大鏡移到左上
  lp.style.left = topRight?'8px':'auto'; lp.style.right = topRight?'auto':'8px';
  lp.style.display='block';
}
function hideLoupe(){ $('loupe').style.display='none'; }
function insetQuad(W,H){ const mx=W*0.12,my=H*0.12; return [{x:mx,y:my},{x:W-mx,y:my},{x:W-mx,y:H-my},{x:mx,y:H-my}]; }
function drawOverlay(){
  const ov=$('overlay'), c=ov.getContext('2d'); c.clearRect(0,0,ov.width,ov.height);
  c.lineWidth=2; c.strokeStyle='#3ad29f'; c.beginPath();
  handles.forEach((p,i)=>{ i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y); }); c.closePath(); c.stroke();
  handles.forEach(p=>{ c.beginPath(); c.arc(p.x,p.y,11,0,7); c.fillStyle='rgba(58,210,159,.35)'; c.fill();
    c.beginPath(); c.arc(p.x,p.y,5,0,7); c.fillStyle='#3ad29f'; c.fill(); });
}
const ov=$('overlay');
ov.addEventListener('pointerdown',e=>{
  const r=ov.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  let best=34,bi=-1; handles.forEach((p,i)=>{ const d=Math.hypot(p.x-x,p.y-y); if(d<best){best=d;bi=i;} });
  dragIdx=bi; if(bi>=0){ ov.setPointerCapture(e.pointerId); showLoupe(handles[bi].x,handles[bi].y); }
});
ov.addEventListener('pointermove',e=>{
  if(dragIdx<0) return; const r=ov.getBoundingClientRect();
  handles[dragIdx]={ x:Math.max(0,Math.min(ov.width,e.clientX-r.left)), y:Math.max(0,Math.min(ov.height,e.clientY-r.top)) };
  drawOverlay(); showLoupe(handles[dragIdx].x,handles[dragIdx].y);
});
ov.addEventListener('pointerup',()=>{ dragIdx=-1; hideLoupe(); });
ov.addEventListener('pointercancel',()=>{ dragIdx=-1; hideLoupe(); });
$('btnApply').onclick=()=>{
  const s=$('editCanvas')._s;
  detectedQuad=orderCorners(handles.map(p=>({x:p.x/s,y:p.y/s})));
  const w=warp(srcImg, detectedQuad, currentAspect());
  drawTo($('outCanvas'), w); w.delete();
  $('statusBox').className='status ok'; $('statusBox').textContent='已依你的四角拉正 ✓';
  show('result');
  copyResult().then(copiedOk).catch(()=>{});
};
</script>
